title: Suspicious certutil Remote File Transfer via URLCache
id: 5b4d7c18-9e20-4a81-b5e1-88419f860004
status: test
description: Detects the use of certutil.exe with the /urlcache or -urlcache parameter to download remote arbitrary payloads onto endpoints.
references:
    - https://attack.mitre.org/techniques/T1105/
author: SOC DFIR Team
date: 2026-09-24
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\certutil.exe'
    selection_command:
        CommandLine|contains:
            - '/urlcache'
            - '-urlcache'
    condition: all of selection_*
fields:
    - Image
    - CommandLine
    - ParentImage
    - ProcessGuid
    - User
falsepositives:
    - Rare legacy administrative certificate retrieval scripts
level: high
tags:
    - attack.command_and_control
    - attack.t1105
